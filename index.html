<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過去問学習ポータル - Interactive Exam App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .marker-highlight { background-color: #fef08a; padding: 0 4px; border-radius: 2px; font-weight: bold; }
        .underline-target { border-bottom: 2px solid #1e40af; font-weight: bold; }
        .blank-space { border-bottom: 2px solid #374151; display: inline-block; min-width: 30px; text-align: center; font-weight: bold; color: #1d4ed8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
    <header class="bg-slate-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>📚</span> 日本語国語入試過去問 演習ポータル
            </h1>
            <div id="year-selector" class="flex gap-2">
                <button onclick="loadYear('2022')" class="year-btn px-3 py-1.5 rounded text-sm font-semibold bg-slate-700 hover:bg-slate-600 transition" data-year="2022">2022年度</button>
                <button onclick="loadYear('2023')" class="year-btn px-3 py-1.5 rounded text-sm font-semibold bg-slate-700 hover:bg-slate-600 transition" data-year="2023">2023年度</button>
                <button onclick="loadYear('2025')" class="year-btn px-3 py-1.5 rounded text-sm font-semibold bg-slate-700 hover:bg-slate-600 transition" data-year="2025">2025年度</button>
                <button onclick="loadYear('2026')" class="year-btn px-3 py-1.5 rounded text-sm font-semibold bg-slate-700 hover:bg-slate-600 transition" data-year="2026">2026年度</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- 本文・問題表示エリア -->
        <div class="lg:col-span-8 space-y-6">
            <div id="passage-card" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden">
                <h2 id="passage-title" class="text-lg font-bold text-slate-900 border-b pb-2 mb-4"></h2>
                <div id="passage-text" class="prose max-w-none text-slate-700 leading-relaxed space-y-4 text-justify whitespace-pre-wrap"></div>
            </div>

            <div id="question-card" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-category" class="px-2.5 py-1 bg-blue-100 text-blue-800 text-xs font-semibold rounded-full"></span>
                    <span id="question-number" class="text-sm font-medium text-slate-500"></span>
                </div>
                <h3 id="question-title" class="text-lg font-bold text-slate-900 mb-6"></h3>
                <div id="options-container" class="space-y-3 mb-6"></div>
                <div id="explanation-box" class="hidden p-4 rounded-lg border"></div>
                
                <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-100">
                    <button id="prev-btn" onclick="navigateQuestion(-1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">前の問題</button>
                    <button id="next-btn" onclick="navigateQuestion(1)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition">次の問題</button>
                </div>
            </div>
        </div>

        <!-- 進捗・分析サイドバー -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <span>📊</span> 学習進捗・正答率
                </h3>
                <div class="relative h-48 mb-4">
                    <canvas id="scoreChart"></canvas>
                </div>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <p class="text-xs text-slate-500">解答済み</p>
                        <p id="answered-count" class="text-xl font-bold text-slate-800">0 / 0</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <p class="text-xs text-slate-500">正答率</p>
                        <p id="accuracy-rate" class="text-xl font-bold text-blue-600">0%</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-3">問題一覧ナビ</h3>
                <div id="question-grid" class="grid grid-cols-5 gap-2"></div>
            </div>
        </div>
    </main>

    <script>
        const examData = {
            "2023": {
                passages: {
                    "p1": `とはい言え、一昔前までの社会では、聴覚から得られる情報はとんでもなく大切だった。<span class="marker-highlight">[ A ]</span>、昭和末期から平成初期にかけては電話こそがコミュニケーションの王者といってもいいくらいだった。\n\nそれが今や、直接会ったり電話で聴覚を使って話をするよりも、メールやSNSなどで視覚を使って話をするほうが日常的になっている。電話は、耳に当てながらしゃべる道具というよりも、黙ってじっと見つめ続ける道具になっている。こんな未来が想像できただろうか。\n\n私たちは今、スマホやケータイ、パソコン、携帯ゲーム機、タブレットなどの画面ばかり見詰めて暮らしている。電車に乗っていて、次の駅がどこかということすら、最近では車掌のアナウンスよりもドアの上の液晶画面で知る。<span class="marker-highlight">[ B ]</span> 今の実際の生活では、視覚情報に八割どころか九割以上頼っているようにすら感じられる。\n\n<span class="marker-highlight">[ C ]</span> 闇の中では、視覚からの情報がほとんどなくなってしまう。ほかの感覚が補うしかない。だから、闇の中にしばらくいるだけで、視覚以外の<span class="underline-target">c あらゆる感覚</span>が驚くほど敏感になる。\n\n夜の山では、自分自身の五感が鋭くなると同時に、人間活動が作り出す騒音、騒臭などからも遠ざかるため、微かな音やにおいを自分でもびっくりするほど感じ取ることができる。\n\n崖の上から降ってくる山百合のにおいも、遠くから漂ってくる梅の香もよくわかるし、微かな腐敗臭や獣の死臭にも気づく。幼虫が木の葉を食む音も、小さな風媒花が枯れてパラパラと着地する音も、向こうにいる獣の息遣いも、なんでもはっきり聴き取れる。肌をなでる微かな風にも、足裏に伝わる地面のやわらかさや凹凸にも、必ず気づく。\n\nカリフォルニア大学バークレー校のノーム・ソベル博士は、チョコレートのにおいがついた長さ十メートルの糸を草地に引き、目隠しと耳栓をした人に四つんばいになってそれをたどってもらう実験をした。その結果、三十二人中二十一人が目的にたどり着いたという。人間の嗅覚は意外に鋭いということを示す実験結果だが、<span class="marker-highlight">[ X ]</span> と思う。においを嗅いで楽しむとき、思わず目を閉じながら嗅ぐのもそういうことだろう。`
                },
                questions: [
                    {
                        id: "2023-30",
                        passageId: "p1",
                        category: "大問3 長文読解",
                        title: "問2 空欄 [ A ] 〜 [ D ] に入る接続詞の組合せを選べ。",
                        options: [
                            "① しかし / だから / したがって / すなわち",
                            "② しかし / さらに / だから / だが",
                            "③ とくに / さらに / ところが / だが",
                            "④ しかし / さらに / したがって / すなわち"
                        ],
                        correct: 2, // Index 2 -> ③
                        explanation: "【正解：③】[ A ]には前文の「聴覚情報の重要性」から「電話」という具体的な事例へ限定・強調する「とくに」が入ります。[ B ]には追加の「さらに」、[ C ]には視覚優位から闇の中への転換を示す「ところが」が入ります。"
                    },
                    {
                        id: "2023-31",
                        passageId: "p1",
                        category: "大問3 長文読解",
                        title: "問3 本文中の空欄 [ X ] に入る内容として最もふさわしいものを選べ。",
                        options: [
                            "① 視覚が奪われたことで嗅覚が敏感になった",
                            "② 視覚や聴覚と違って意識せずとも感度を上げられる",
                            "③ 嗅覚だけでなく周囲の状況を正確にとらえた",
                            "④ 五感の鋭さは人によって異なっている"
                        ],
                        correct: 0, // Index 0 -> ①
                        explanation: "【正解：①】実験では「目隠しと耳栓」によって視覚・聴覚が遮断された状態で嗅覚の鋭さが実証されています。直後の「目を閉じながら嗅ぐのもそういうこと」という文脈とも一致します。"
                    }
                ]
            },
            "2025": {
                passages: {},
                questions: [
                    {
                        id: "2025-2",
                        category: "大問1 漢字",
                        title: "問1 イ「小説を読んでカンメイを受ける。」と同じ漢字を含むものを選べ。",
                        options: [
                            "① いくつもの国とドウメイを結ぶ。",
                            "② 若者の意見にキョウメイする。",
                            "③ 彼は正真正ショウメイの英雄だ。",
                            "④ 事態がコンメイを極める。"
                        ],
                        correct: 2, // Index 2 -> ③
                        explanation: "【正解：③】カンメイ＝「感銘（銘）」。③「正真正銘（銘）」で同じ漢字を使用しています。①同盟、②共鳴、④混迷。"
                    },
                    {
                        id: "2025-7",
                        category: "大问1 漢字",
                        title: "問2 イ「相手のミスで辛勝した。」の「辛」と同じ読みを含むものを選べ。",
                        options: [
                            "① 街の中が閑散としている。",
                            "② 海外市場から駆逐される。",
                            "③ 鉄道による輸送が衰退する。",
                            "④ 地域の産業の振興を図る。"
                        ],
                        correct: 3, // Index 3 -> ④
                        explanation: "【正解：④】「辛勝（シンショウ）」の「辛（シン）」に対し、④「振興（シンコウ）」の「振（シン）」が同じ音読みになります。"
                    }
                ]
            }
        };

        let currentYear = '2023';
        let currentQuestionIdx = 0;
        let userAnswers = {};
        let scoreChart = null;

        function initApp() {
            initChart();
            loadYear('2023');
        }

        function loadYear(year) {
            currentYear = year;
            currentQuestionIdx = 0;
            
            document.querySelectorAll('.year-btn').forEach(btn => {
                if (btn.dataset.year === year) {
                    btn.classList.remove('bg-slate-700');
                    btn.classList.add('bg-blue-600', 'text-white');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('bg-slate-700');
                }
            });

            renderQuestionGrid();
            renderQuestion();
            updateStats();
        }

        function renderQuestion() {
            const yearData = examData[currentYear];
            if (!yearData || !yearData.questions.length) {
                document.getElementById('question-title').innerText = "データが登録されていません。";
                document.getElementById('options-container').innerHTML = "";
                document.getElementById('passage-card').classList.add('hidden');
                return;
            }

            const q = yearData.questions[currentQuestionIdx];
            
            // Passage
            if (q.passageId && yearData.passages[q.passageId]) {
                document.getElementById('passage-card').classList.remove('hidden');
                document.getElementById('passage-title').innerText = "【長文本文】";
                document.getElementById('passage-text').innerHTML = yearData.passages[q.passageId];
            } else {
                document.getElementById('passage-card').classList.add('hidden');
            }

            // Question
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-number').innerText = `問題 ${currentQuestionIdx + 1} / ${yearData.questions.length}`;
            document.getElementById('question-title').innerText = q.title;

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const answered = userAnswers[q.id];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-lg border text-sm transition flex justify-between items-center ";
                
                if (answered !== undefined) {
                    if (idx === q.correct) {
                        btn.classList.add('border-green-500', 'bg-green-50', 'text-green-900', 'font-semibold');
                        btn.innerHTML = `<span>${opt}</span><span class="text-green-600 font-bold">✓ 正解</span>`;
                    } else if (idx === answered) {
                        btn.classList.add('border-red-500', 'bg-red-50', 'text-red-900');
                        btn.innerHTML = `<span>${opt}</span><span class="text-red-600 font-bold">✕ 選択した誤答</span>`;
                    } else {
                        btn.classList.add('border-slate-200', 'opacity-60');
                        btn.innerText = opt;
                    }
                } else {
                    btn.classList.add('border-slate-200', 'hover:border-blue-400', 'hover:bg-slate-50');
                    btn.innerText = opt;
                    btn.onclick = () => selectOption(q.id, idx);
                }
                optionsContainer.appendChild(btn);
            });

            // Explanation
            const expBox = document.getElementById('explanation-box');
            if (answered !== undefined) {
                expBox.classList.remove('hidden');
                const isCorrect = answered === q.correct;
                expBox.className = `p-4 rounded-lg border mt-4 text-sm leading-relaxed ${isCorrect ? 'bg-green-50 border-green-200 text-green-900' : 'bg-red-50 border-red-200 text-red-900'}`;
                expBox.innerHTML = `
                    <div class="font-bold mb-1">${isCorrect ? '🎉 正解です！' : '✕ 不正解です'}</div>
                    <div>${q.explanation}</div>
                `;
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation Buttons
            document.getElementById('prev-btn').disabled = currentQuestionIdx === 0;
            document.getElementById('next-btn').disabled = currentQuestionIdx === yearData.questions.length - 1;
        }

        function selectOption(qId, optionIdx) {
            userAnswers[qId] = optionIdx;
            renderQuestion();
            renderQuestionGrid();
            updateStats();
        }

        function navigateQuestion(direction) {
            const yearData = examData[currentYear];
            if (!yearData) return;
            const newIdx = currentQuestionIdx + direction;
            if (newIdx >= 0 && newIdx < yearData.questions.length) {
                currentQuestionIdx = newIdx;
                renderQuestion();
            }
        }

        function renderQuestionGrid() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';
            const yearData = examData[currentYear];
            if (!yearData) return;

            yearData.questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = "h-9 w-9 rounded-lg text-xs font-bold transition flex items-center justify-center ";
                const answered = userAnswers[q.id];

                if (idx === currentQuestionIdx) {
                    btn.classList.add('ring-2', 'ring-blue-600', 'ring-offset-1');
                }

                if (answered !== undefined) {
                    if (answered === q.correct) {
                        btn.classList.add('bg-green-500', 'text-white');
                    } else {
                        btn.classList.add('bg-red-500', 'text-white');
                    }
                } else {
                    btn.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                }

                btn.innerText = idx + 1;
                btn.onclick = () => {
                    currentQuestionIdx = idx;
                    renderQuestion();
                };
                grid.appendChild(btn);
            });
        }

        function updateStats() {
            const yearData = examData[currentYear];
            if (!yearData) return;

            let answeredCount = 0;
            let correctCount = 0;

            yearData.questions.forEach(q => {
                const ans = userAnswers[q.id];
                if (ans !== undefined) {
                    answeredCount++;
                    if (ans === q.correct) correctCount++;
                }
            });

            const total = yearData.questions.length;
            const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

            document.getElementById('answered-count').innerText = `${answeredCount} / ${total}`;
            document.getElementById('accuracy-rate').innerText = `${accuracy}%`;

            if (scoreChart) {
                scoreChart.data.datasets[0].data = [correctCount, answeredCount - correctCount, total - answeredCount];
                scoreChart.update();
            }
        }

        function initChart() {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            scoreChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['正解', '不正解', '未解答'],
                    datasets: [{
                        data: [0, 0, 1],
                        backgroundColor: ['#22c55e', '#ef4444', '#e2e8f0'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    },
                    cutout: '70%'
                }
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
